[Proxy Group]
# ===== 总出口 =====
🟢 Proxy = select, "♻️ 自动选择", "🚀 直接连接"
# ===== 自动选择 / 地区分组 =====
# url-test 策略自动选择延迟最低的节点
♻️ 自动选择 = url-test, "v2rayse_test_1", "v2rayse_test_2", "v2rayse_test_3", "defaultName_2", "defaultName_3", "sgp-optimize-Hysteria2", "sgp-ss-normal", "defaultName_4", url=http://www.gstatic.com/generate_204, interval=300, tolerance=50

